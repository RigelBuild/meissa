name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Serial runs: two release-please runs racing would fight over the release PR and tags.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: main
    permissions: {}
    env:
      RELEASE_BRANCH: release-please--branches--main
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Look for an open release PR
        id: release-pr-branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          count="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$RELEASE_BRANCH" --state open --json number --jq 'length')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      # release-please rewrites the release branch from main on each run that updates the PR,
      # so this formatting commit is made again on every run, not kept from an earlier one.
      - name: Check out the release PR branch
        if: steps.release-pr-branch.outputs.count != '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Install Nix
        if: steps.release-pr-branch.outputs.count != '0'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Only CHANGELOG.md files this release touched. Biome's own exit code fails the step; the
      # --no-errors-on-unmatched flag only lets paths the biome config ignores pass.
      - name: Format release CHANGELOGs with the CI biome
        if: steps.release-pr-branch.outputs.count != '0'
        run: |
          set -euo pipefail
          biome="$(nix build --no-link --print-out-paths .#biome)"
          git diff --name-only --diff-filter=AMR origin/main...HEAD -- '*CHANGELOG.md' \
            | xargs -r "$biome/bin/biome" format --write --no-errors-on-unmatched
          if git diff --quiet; then
            echo "release CHANGELOGs already match the CI biome format"
            exit 0
          fi
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git commit -a -m "chore(release): format changelogs with biome"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"

  publish:
    # A manual dispatch publishes every package; the script skips versions already on npm.
    if: github.ref == 'refs/heads/main' && (needs.release-pr.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch')
    needs: release-pr
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read
      id-token: write
    env:
      PATHS_RELEASED: ${{ needs.release-pr.outputs.paths_released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Put Go and Node.js on PATH
        run: |
          mapfile -t outputs < <(nix build --no-link --print-out-paths --inputs-from . .#go-dev nixpkgs#nodejs)
          for output in "${outputs[@]}"; do
            echo "$output/bin" >> "$GITHUB_PATH"
          done

      # npm trusted publishing (OIDC) needs npm >= 11.5.1; the pinned Node 24 ships 11.x.
      # Each package is published once by hand first, then gets its trusted publisher.
      # A re-run skips versions already on npm, so it can finish a partial release.
      - name: Publish released packages
        run: go -C go run ./cmd/npm-publish
        env:
          PUBLISH_ALL: ${{ github.event_name == 'workflow_dispatch' }}
          GOTOOLCHAIN: local
          GOWORK: off
          GOFLAGS: -mod=readonly
