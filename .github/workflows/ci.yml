name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history: moon diffs against main for affected files, which a shallow clone lacks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build exported tools and policy
        run: |
          rumdl="$(nix build --no-link --print-out-paths .#rumdl)"
          biome="$(nix build --no-link --print-out-paths .#biome)"
          base_config="$(nix build --no-link --print-out-paths .#rumdl-base-config)"
          echo "$rumdl/bin" >> "$GITHUB_PATH"
          echo "$biome/bin" >> "$GITHUB_PATH"
          echo "RUMDL_BASE_CONFIG=$base_config/rumdl/base.toml" >> "$GITHUB_ENV"
          echo "RUMDL_BIN=$rumdl/bin/rumdl" >> "$GITHUB_ENV"

      # The dev shell's runtimes, from the same nixpkgs pin, so CI and local runs agree.
      - name: Put Bun, Node.js, and moon on PATH
        run: |
          mapfile -t outputs < <(nix build --no-link --print-out-paths --inputs-from . nixpkgs#bun nixpkgs#nodejs nixpkgs#moon)
          for output in "${outputs[@]}"; do
            echo "$output/bin" >> "$GITHUB_PATH"
          done

      - name: Check the flake
        run: nix flake check

      - name: Run workspace CI
        run: moon run :ci --force
