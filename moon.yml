# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
layer: 'library'
language: 'typescript'

tasks:
  install:
    command: 'bun install --frozen-lockfile'
    inputs: ['/package.json', '/bun.lock', '/bunfig.toml']
    options:
      internal: true
      cache: false
      runFromWorkspaceRoot: true

  lint:
    command: 'biome check .'
    deps: ['install']
    options:
      cache: false
      runFromWorkspaceRoot: true

  markdownlint:
    command: 'rumdl check .'
    deps: ['install']
    options:
      cache: false
      runFromWorkspaceRoot: true

  refgate:
    command: 'bun packages/ref-gate/index.ts --config ref-gate.config.json'
    deps: ['install']
    options:
      cache: false
      runFromWorkspaceRoot: true

  test:
    command: 'bun test rumdl-extends.test.ts tools/renovate/config.test.ts ref-gate.config.test.ts'
    deps: ['install']
    options:
      runFromWorkspaceRoot: true

  ci:
    deps: ['lint', 'markdownlint', 'refgate', 'test']
    options:
      cache: false
