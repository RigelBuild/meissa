# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
layer: "library"
language: "typescript"

tasks:
  install:
    command: "bun install --frozen-lockfile"
    inputs: ["/package.json", "/bun.lock", "/bunfig.toml"]
    options:
      internal: true
      cache: false
      runFromWorkspaceRoot: true

  lint:
    command: "biome check ."
    options:
      cache: false
      runFromWorkspaceRoot: true

  markdownlint:
    command: "rumdl check ."
    deps: ["install"]
    options:
      cache: false
      runFromWorkspaceRoot: true

  refgate:
    command: "ref-gate --config ref-gate.config.json"
    deps: ["install"]
    options:
      cache: false
      runFromWorkspaceRoot: true

  test:
    deps: ["go:test"]
    options:
      runFromWorkspaceRoot: true

  publish-test:
    command: "bun test tools/release/publish.test.ts"
    deps: ["install"]
    options:
      runFromWorkspaceRoot: true

  ci:
    deps: ["lint", "markdownlint", "refgate", "test", "publish-test"]
    options:
      cache: false
