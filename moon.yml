# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
layer: "library"

tasks:
  lint:
    command: "biome check ."
    options:
      cache: false
      runFromWorkspaceRoot: true

  markdownlint:
    command: "rumdl check ."
    options:
      cache: false
      runFromWorkspaceRoot: true

  refgate:
    command: "ref-gate --config ref-gate.config.json"
    options:
      cache: false
      runFromWorkspaceRoot: true

  test:
    deps: ["go:test"]
    options:
      runFromWorkspaceRoot: true

  ci:
    deps: ["lint", "markdownlint", "refgate", "test"]
    options:
      cache: false
